name: Crawl NisaanSearchEngine index

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger controlled crawler
        run: |
          set -e
          url='https://nisaan-searchengine-api.onrender.com/crawl?max_pages=10'
          for attempt in 1 2 3 4 5; do
            echo "Crawler attempt ${attempt}/5"
            if curl --fail --show-error --silent --max-time 120 "$url"; then
              echo
              exit 0
            fi
            echo "Crawler returned an error; waiting 20 seconds before retry..."
            sleep 20
          done
          echo "Crawler failed after 5 attempts"
          exit 1
